name: Build LaTeX PDF

on:
  push:
    branches:
      - main
      - refactor
  pull_request:

permissions:
  contents: read
  actions: write

concurrency:
  group: latex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Remove previously built PDF
        run: rm -f doc/theoretical_basis.pdf

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: doc
          root_file: theoretical_basis.tex
          latexmk_use_lualatex: false
          latexmk_shell_escape: false
          extra_system_packages: "ghostscript"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v6
          name: theoretical_basis
          path: doc/theoretical_basis.pdf
          if-no-files-found: error
